# /etc/nginx/sites-available/eyelevel-interviews   (replace interview.theeyelevelstudio.com, then run certbot)
limit_req_zone $binary_remote_addr zone=eli_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name interview.theeyelevelstudio.com;

    client_max_body_size 100k;

    location /api/ {
        limit_req zone=eli_api burst=20 nodelay;
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
