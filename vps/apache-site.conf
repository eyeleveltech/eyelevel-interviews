# Use THIS file instead of nginx-site.conf if the server already runs Apache (the main website does).
# Save as /etc/apache2/sites-available/interview.conf
<VirtualHost *:80>
    ServerName interview.theeyelevelstudio.com

    ProxyPreserveHost On
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/

    LimitRequestBody 102400
    ErrorLog  ${APACHE_LOG_DIR}/interview-error.log
    CustomLog ${APACHE_LOG_DIR}/interview-access.log combined
</VirtualHost>
